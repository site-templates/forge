# The visual editor's contract for sections/more-writing.blade.php.
title: More writing
description: Every other essay, listed at the foot of an essay page
fields:
    label:
        type: text
        label: Section label
        default: "More writing"
    current:
        type: text
        label: Current slug
        description: Set by the essay page — the matching entry is left out of the list.
        default: ""
    writings:
        type: repeater
        label: Essays
        add_button_label: "Add essay"
        item_label: title
        source: writings
        sub_fields:
            title:
                type: text
                label: Title
                default: "New essay"
            slug:
                type: text
                label: URL slug
                default: "new-essay"
            link:
                type: url
                label: Page link
                default: "/writing/new-essay"
            dateFormatted:
                type: text
                label: Date
                default: ""
