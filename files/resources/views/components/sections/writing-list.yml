# The visual editor's contract for sections/writing-list.blade.php.
# Shows the first three entries of the writings collection.
title: Recent writing
description: The three latest essays, with the link through to the archive
fields:
    label:
        type: text
        label: Section label
        default: "Recent writing"
    linkText:
        type: text
        label: Link text
        description: Leave empty to hide the link.
        default: "All writing"
    link:
        type: url
        label: Link
        default: "/writing"
    writings:
        type: repeater
        label: Essays
        add_button_label: "Add essay"
        item_label: title
        source: writings
        sub_fields:
            title:
                type: text
                label: Title
                default: "New essay"
            slug:
                type: text
                label: URL slug
                default: "new-essay"
            link:
                type: url
                label: Page link
                default: "/writing/new-essay"
            description:
                type: textarea
                label: Summary
                rows: 3
                default: ""
            dateFormatted:
                type: text
                label: Date
                default: ""
            yearLabel:
                type: text
                label: Year heading
                description: Set on the first essay of a year; leave empty on the rest.
                default: ""
            readTime:
                type: text
                label: Reading time
                default: "4 min read"
            content:
                type: richtext
                label: Body
                default: ""
